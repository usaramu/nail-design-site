<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デザイン一覧</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611101905">
  <style>
    .design { border-top: 1px solid var(--line); padding: 14px 0 0; margin-bottom: 8px; }
    .design > summary {
      cursor: pointer; list-style: none; font-family: var(--serif); font-weight: 700; font-size: 1.12rem;
      color: var(--bordeaux); letter-spacing: .03em; padding: 4px 0 10px;
    }
    .design > summary::-webkit-details-marker { display: none; }
    .design > summary::after { content: '＋'; float: right; color: var(--muted); font-family: var(--sans); }
    .design[open] > summary::after { content: '－'; }
    .design-body { padding: 4px 0 18px; }
    .design-body h3 { font-family: var(--serif); font-weight: 600; font-size: .98rem; margin: 22px 0 8px; color: var(--ink); }
    .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .step img { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: var(--surface); }
    .step .empty-img { border: 1px dashed var(--line); padding: 36px 0; text-align: center; color: var(--muted); font-size: .85rem; }
    .step figcaption { font-size: .8rem; color: var(--muted); margin: 8px 0 6px; }
    .step input[type=file] { display: none; }
    .guide-link { font-size: .85rem; }
  </style>
</head>
<body>
  <p><a href="../index.html">← ホームへ戻る</a></p>
  <h1>デザイン一覧</h1>

  <div id="list"></div>

  <details class="card" style="margin-top:24px">
    <summary style="cursor:pointer;font-weight:bold;color:#7a1f2b">＋ 新しいデザインを追加（購入リストにも反映）</summary>
    <form id="newform" style="margin-top:12px">
      <label style="display:block;font-size:.85rem">デザインのキー（英字・例: spring）
        <input id="nkey" required style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #d6c5bd;border-radius:6px;font:inherit">
      </label>
      <label style="display:block;font-size:.85rem;margin-top:10px">表示名（例: Spring Pink）
        <input id="nname" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #d6c5bd;border-radius:6px;font:inherit">
      </label>

      <h3 style="font-size:.95rem;margin:14px 0 4px">今ある持ち物から使うもの（チェック）</h3>
      <div id="pick" class="meta"></div>

      <h3 style="font-size:.95rem;margin:14px 0 4px">新しく買うもの（1行に1つ）</h3>
      <textarea id="nnew" rows="6" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #d6c5bd;border-radius:6px;font:inherit" placeholder="名前 | カテゴリ | 色・番号 | サイズ | 購入先"></textarea>

      <div style="text-align:right;margin-top:14px">
        <button type="submit" id="save" style="background:#7a1f2b;color:#fff;border-color:#7a1f2b">保存して購入リストに反映</button>
      </div>
    </form>
  </details>

  <p id="msg" class="note"></p>

  <script src="../assets/config.js?v=202611101905"></script>
  <script src="../assets/app.js?v=202611101905"></script>
  <script>
    const $ = s => document.querySelector(s);
    let items = [];
    let images = []; // 差し替えた指示画像（シート designimages）

    // デザインキー → 表示名・ガイドページ・既定の指示画像
    const DESIGNS = {
      harvard: {
        name: 'Harvard Law Chic（SET02）',
        page: 'harvard-law-chic/index.html',
        defaults: {
          STEP2A: 'harvard-law-chic/images/right-hand-step2a.png',
          STEP2B: 'harvard-law-chic/images/left-hand-step2b.png'
        }
      }
    };

    // 指示画像の枠（どのデザインでも2枚）
    const SLOTS = [
      { slot: 'STEP2A', label: 'STEP 2A（右手）' },
      { slot: 'STEP2B', label: 'STEP 2B（左手）' }
    ];

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        let loaded = false;
        await Promise.all([
          ND.listFast(null, d => { items = d; loaded = true; render(); renderPick(); }),
          ND.listFast('designimages', d => { images = d; if (loaded) render(); }).catch(() => { images = []; })
        ]);
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    // 枠ごとの画像URL：差し替えたもの → 既定の画像 の順
    function imageFor(key, slot) {
      const hit = images.find(x => x.design === key && x.slot === slot);
      if (hit && hit.url) return hit.url;
      const d = DESIGNS[key];
      return d && d.defaults && d.defaults[slot] ? d.defaults[slot] : '';
    }

    function render() {
      const keys = [...new Set(items.flatMap(ND.designsOf))];
      if (!keys.length) {
        $('#list').innerHTML = '<p class="done">まだありません。</p>';
        return;
      }
      $('#list').innerHTML = keys.map(key => {
        const d = DESIGNS[key] || { name: key };
        const need = items.filter(i => ND.designsOf(i).includes(key));
        const have = need.filter(i => i.status === '持ち物');
        const missing = need.filter(i => i.status === '購入リスト');
        const low = have.filter(i => i.low);
        const line = list => list.length
          ? list.map(i => `<li>${ND.esc(i.name)}${i.color ? '（' + ND.esc(i.color) + '）' : ''}</li>`).join('')
          : '<li>なし</li>';
        const steps = SLOTS.map(s => {
          const src = imageFor(key, s.slot);
          return `
            <figure class="step" style="margin:0">
              ${src
                ? `<img class="zoom" src="${ND.esc(/^https?:/.test(src) ? src : '../' + src)}" alt="${ND.esc(s.label)}">`
                : `<div class="empty-img">写真を入れてください</div>`}
              <figcaption>${ND.esc(s.label)}</figcaption>
              <button type="button" data-act="pick" data-design="${ND.esc(key)}" data-slot="${s.slot}">写真を入れる・差し替える</button>
              <input type="file" accept="image/*" data-design="${ND.esc(key)}" data-slot="${s.slot}">
            </figure>`;
        }).join('');
        return `
          <details class="design">
            <summary>${ND.esc(d.name)}</summary>
            <div class="design-body">
              ${d.page ? `<p class="guide-link"><a href="${d.page}">制作ガイドを開く</a></p>` : ''}

              <h3>指示画像</h3>
              <div class="steps">${steps}</div>

              <h3>持っている ${have.length} / ${need.length}</h3>
              <h3>足りない（購入リスト）</h3>
              <ul class="meta">${line(missing)}</ul>
              <h3>残り少なめ</h3>
              <ul class="meta">${line(low)}</ul>
            </div>
          </details>`;
      }).join('');
    }

    function renderPick() {
      $('#pick').innerHTML = items.length
        ? items.map(i => `
            <label style="display:flex;gap:8px;align-items:center;margin:4px 0">
              <input type="checkbox" value="${ND.esc(i.id)}">
              <span>${ND.esc(i.name)}${i.color ? '（' + ND.esc(i.color) + '）' : ''}
                <small>［${i.status === '持ち物' ? '持ち物' : '購入リスト'}］</small></span>
            </label>`).join('')
        : '<p class="empty">まだありません。</p>';
    }

    // 「写真を入れる」ボタンで、対応する入力欄を開く
    $('#list').addEventListener('click', e => {
      const b = e.target.closest('button[data-act="pick"]');
      if (!b) return;
      const input = b.parentElement.querySelector('input[type=file]');
      input.click();
    });

    // 写真を選んだら、軽くしてドライブに保存し、枠に登録する
    $('#list').addEventListener('change', async e => {
      const input = e.target;
      if (input.type !== 'file') return;
      const file = input.files[0];
      if (!file) return;
      $('#msg').textContent = '写真を軽くして保存しています…';
      try {
        const url = await ND.uploadPhoto(file);
        await ND.send('setDesignImage', { design: input.dataset.design, slot: input.dataset.slot, url });
        $('#msg').textContent = '指示画像を入れ替えました。';
        await reload();
      } catch (err) {
        $('#msg').textContent = '保存できませんでした: ' + err.message;
      }
      input.value = '';
    });

    $('#newform').addEventListener('submit', async e => {
      e.preventDefault();
      const key = $('#nkey').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (!key) return alert('デザインのキーは英字で入力してください（例: spring）');
      const btn = $('#save');
      btn.disabled = true;
      try {
        for (const cb of $('#pick').querySelectorAll('input[type=checkbox]:checked')) {
          const it = items.find(i => i.id === cb.value);
          if (!it) continue;
          const keys = ND.designsOf(it);
          if (!keys.includes(key)) keys.push(key);
          await ND.send('update', { id: it.id, fields: { designs: keys.join(', ') } });
        }
        const lines = $('#nnew').value.split('\n').map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
          const [name, cat, color, size, shop] = line.split('|').map(s => (s || '').trim());
          if (!name) continue;
          await ND.send('add', { item: {
            name,
            category: ND.categories.includes(cat) ? cat : '基本用品',
            color: color || '',
            size: size || '',
            shop: shop || '',
            designs: key,
            status: '購入リスト',
            low: false
          } });
        }
        $('#newform').reset();
        $('#msg').textContent = `「${key}」を追加しました。`;
        await reload();
      } catch (err) {
        alert('追加できませんでした: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    reload();
  </script>
</body>
</html>
