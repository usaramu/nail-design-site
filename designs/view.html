<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デザイン</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611102051">
  <style>
    .design { border-top: 1px solid var(--line); padding: 14px 0 0; margin-bottom: 8px; }
    .design > summary {
      cursor: pointer; list-style: none; font-family: var(--serif); font-weight: 700; font-size: 1.12rem;
      color: var(--bordeaux); letter-spacing: .03em; padding: 4px 0 10px;
    }
    .design > summary::-webkit-details-marker { display: none; }
    .design > summary::after { content: '＋'; float: right; color: var(--muted); font-family: var(--sans); }
    .design[open] > summary::after { content: '－'; }
    .design-body { padding: 4px 0 18px; }
    .design-body h3 { font-family: var(--serif); font-weight: 600; font-size: .98rem; margin: 22px 0 8px; color: var(--ink); }
    .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .step img { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: var(--surface); }
    .step .empty-img { border: 1px dashed var(--line); padding: 36px 0; text-align: center; color: var(--muted); font-size: .85rem; }
    .step figcaption { font-size: .8rem; color: var(--muted); margin: 8px 0 6px; }
    .step input[type=file] { display: none; }
    .ops { margin: -6px 0 6px; display: flex; gap: 8px; }
    .ops button { border-radius: 999px; font-size: .78rem; padding: 4px 14px; }

    /* 使うもの：丸い写真で並べる */
    .uses { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 8px; margin: 6px 0 10px; }
    .use { min-width: 0; text-align: center; position: relative; }
    .use .ph {
      display: block; width: 54px; height: 54px; margin: 2px auto 6px; border-radius: 50%; object-fit: cover;
      background: var(--surface); border: 1px dashed var(--gold);
    }
    .use img.ph { border: 0; box-shadow: 0 0 0 1px var(--line), 0 0 0 3px var(--paper), 0 0 0 4px rgba(176,141,87,.55); }
    .use .nm { display: block; font-size: .66rem; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .use.not-owned .ph { opacity: .45; }
    .use .buy { display: inline-block; font-size: .6rem; color: var(--bordeaux); border: 1px solid var(--bordeaux); border-radius: 999px; padding: 0 6px; margin-top: 2px; }
    .uses-empty { color: var(--muted); font-size: .85rem; margin: 4px 0 8px; }
    .choose { border-radius: 999px; font-size: .8rem; padding: 6px 14px; }

    /* 使うものを選ぶシート */
    #picker {
      margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92dvh;
      padding: 0; border: 0; border-radius: 18px 18px 0 0; overflow: hidden;
      background: var(--surface); box-shadow: 0 -10px 30px rgba(42, 28, 32, .12);
    }
    #picker[open] { animation: nd-up .25s ease-out; }
    #picker .wrap { display: flex; flex-direction: column; max-height: 92dvh; }
    #picker .pick-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 16px; }
    #picker h4 { font-size: .85rem; color: var(--bordeaux); margin: 16px 0 10px; font-weight: 700; }
    #picker .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 8px; }
    #picker .opt { min-width: 0; padding: 0; border: 0; background: transparent; text-align: center; position: relative; border-radius: 0; color: var(--ink); }
    #picker .opt:hover { background: transparent; color: var(--ink); }
    #picker .opt .ph { display: block; width: 54px; height: 54px; margin: 4px auto 6px; border-radius: 50%; object-fit: cover; background: var(--paper); border: 1px dashed var(--gold); transition: box-shadow .15s; }
    #picker .opt img.ph { border: 0; box-shadow: 0 0 0 1px var(--line); }
    #picker .opt .nm { display: block; font-size: .66rem; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #picker .opt.on .ph { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--bordeaux); }
    #picker .opt.on .nm { color: var(--bordeaux); font-weight: 500; }
    #picker .opt .ck {
      position: absolute; top: 0; left: calc(50% + 14px); width: 20px; height: 20px; border-radius: 50%;
      background: var(--bordeaux); color: #fff; font-size: .7rem; line-height: 20px; display: none; border: 2px solid var(--surface);
    }
    #picker .opt.on .ck { display: block; }
    #picker .count { font-size: .78rem; color: var(--muted); font-weight: 400; margin-left: 8px; }
    /* 使うもの：そろい具合と、持っている／これから買う の2つに分ける */
    .summary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 4px 0 6px; }
    .snum { font-size: .82rem; color: var(--muted); }
    .snum b { font-size: 1.6rem; color: var(--bordeaux); font-family: var(--serif); margin-right: 2px; }
    .snum span { font-size: 1rem; color: var(--ink); margin-right: 6px; }
    .sbar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 8px; }
    .sbar span { display: block; height: 100%; background: var(--gold); border-radius: 6px; }
    h4.sec { display: flex; align-items: center; gap: 8px; font-size: .9rem; margin: 22px 0 10px; font-weight: 700; }
    h4.sec small { font-weight: 400; color: var(--muted); font-size: .8rem; }
    h4.sec .dot { width: 9px; height: 9px; border-radius: 50%; }
    h4.sec.ok { color: var(--ink); } h4.sec.ok .dot { background: var(--gold); }
    h4.sec.ng { color: var(--bordeaux); } h4.sec.ng .dot { background: transparent; border: 2px solid var(--bordeaux); }
    .use .usa { position: absolute; top: -6px; left: calc(50% + 12px); width: 20px; height: 24px; transform: rotate(10deg); filter: drop-shadow(0 2px 3px rgba(122,31,43,.22)); }
    .tobuy { list-style: none; margin: 0; padding: 0; border-top: 1px dashed var(--line); }
    .tobuy li { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px dashed var(--line); }
    .tobuy .ph { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--paper); border: 1px dashed var(--bordeaux); }
    .tobuy img.ph { border: 0; opacity: .6; }
    .tobuy .bt { flex: 1; min-width: 0; }
    .tobuy .bn { display: block; font-size: .9rem; line-height: 1.5; }
    .tobuy small { display: block; font-size: .72rem; color: var(--muted); }
    .tolist { margin: 10px 0 0; font-size: .82rem; }
    button.use { padding: 0; border: 0; background: transparent; border-radius: 0; color: var(--ink); width: 100%; }
    button.use:hover { background: transparent; }
    .tobuy li { gap: 8px; }
    .brow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; border-radius: 0; text-align: left; color: var(--ink); }
    .brow:hover { background: transparent; color: var(--bordeaux); }
    .bought { flex-shrink: 0; border-radius: 999px; font-size: .74rem; padding: 4px 12px; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
    /* 使うもの一覧：・名前　写真 */
    h4.sec { color: var(--ink); }
    .uselist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .uselist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .uselist li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; margin-left: 2px; }
    .uselist li.need::before { background: transparent; border: 1.5px solid var(--bordeaux); width: 5px; height: 5px; }
    .urow { flex: 1; min-width: 0; padding: 4px 0; border: 0; border-radius: 0; background: transparent; text-align: left; color: var(--ink); font-size: .92rem; font-weight: 300; }
    .urow:hover { background: transparent; color: var(--bordeaux); }
    .urow small { display: block; font-size: .72rem; color: var(--muted); }
    .uselist li.need .urow { color: var(--muted); }
    .circ { position: relative; flex-shrink: 0; cursor: pointer; margin-right: 5px; }
    .circ .ph { display: block; width: 44px; height: 44px; margin: 0; border-radius: 50%; object-fit: cover; background: var(--paper); border: 1px dashed var(--bordeaux); }
    .circ img.ph { border: 0; box-shadow: 0 0 0 1px var(--line), 0 0 0 3px var(--paper), 0 0 0 4px rgba(176,141,87,.55); }
    .circ .usa { position: absolute; top: -10px; right: -8px; left: auto; width: 18px; height: 22px; transform: rotate(10deg); filter: drop-shadow(0 2px 3px rgba(122,31,43,.22)); }
    .hero img { display: block; width: min(100%, 320px); aspect-ratio: 4 / 5; object-fit: cover; border-radius: 18px; margin: 0 0 14px; border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(42,28,32,.08); cursor: zoom-in; }
    .thumbpick { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .tprev { width: 64px; height: 80px; border-radius: 10px; border: 1px dashed var(--gold); background: var(--paper); flex-shrink: 0; overflow: hidden; }
    .tprev img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumbpick { flex-wrap: wrap; }
    .thumbpick input { margin-top: 0 !important; flex: 1; min-width: 160px; }
    .tbtns { display: flex; gap: 6px; width: 100%; }
    .tbtns button { border-radius: 999px; font-size: .76rem; padding: 4px 12px; }
    .choose.main { background: var(--bordeaux); color: #fff; }
    .choose.main:hover { background: #5c1620; }
    #new-dlg .count { font-size: .78rem; color: var(--muted); font-weight: 400; margin-left: 10px; }
    #new-dlg h4.sub { font-size: .82rem; color: var(--muted); margin: 18px 0 10px; font-weight: 500; }
    #new-dlg textarea { line-height: 1.9; }
    .want { font-size: 1.05rem; font-weight: 500; margin: 14px 0 12px; }
    .want span { display: block; font-size: .72rem; color: var(--muted); font-weight: 400; margin-bottom: 2px; }
    .nothave { width: 100%; border-radius: 12px; padding: 11px; border: 1px dashed var(--bordeaux); color: var(--bordeaux); background: var(--surface); font-size: .86rem; }
    .nothave.on { background: var(--bordeaux); color: #fff; border-style: solid; }
    .catpick { display: flex; gap: 8px; margin-top: 10px; }
    .catpick button { flex: 1; border-radius: 999px; font-size: .8rem; padding: 6px; border-color: var(--line); color: var(--ink); }
    .catpick button.on { background: #fbdbe2; border-color: var(--bordeaux); color: var(--bordeaux); }
    #new-dlg .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 8px; }
    #new-dlg .opt { min-width: 0; padding: 0; border: 0; background: transparent; text-align: center; position: relative; border-radius: 0; color: var(--ink); }
    #new-dlg .opt:hover { background: transparent; }
    #new-dlg .opt .ph { display: block; width: 54px; height: 54px; margin: 4px auto 6px; border-radius: 50%; object-fit: cover; background: var(--paper); border: 1px dashed var(--gold); }
    #new-dlg .opt img.ph { border: 0; box-shadow: 0 0 0 1px var(--line); }
    #new-dlg .opt .nm { display: block; font-size: .66rem; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #new-dlg .opt .nb { display: inline-block; font-size: .56rem; color: var(--bordeaux); border: 1px solid var(--bordeaux); border-radius: 999px; padding: 0 5px; }
    #new-dlg .opt.on .ph { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--bordeaux); }
    #new-dlg .opt.on .nm { color: var(--bordeaux); font-weight: 500; }
    #new-dlg .opt .ck { position: absolute; top: 0; left: calc(50% + 14px); width: 20px; height: 20px; border-radius: 50%; background: var(--bordeaux); color: #fff; font-size: .7rem; line-height: 20px; display: none; border: 2px solid var(--surface); }
    #new-dlg .opt.on .ck { display: block; }
    .confirm { list-style: none; margin: 10px 0 0; padding: 0; }
    .confirm li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
    .confirm .w { font-weight: 500; }
    .confirm .arrow { color: var(--muted); }
    .confirm .r { color: var(--ink); }
    .confirm .r.need { color: var(--bordeaux); }
    #nd-dlg h4.sub { font-size: .83rem; color: var(--muted); font-weight: 400; margin: 18px 0 8px; }
    .usenames { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .usenames li { font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
    .usenames li.own { border-color: var(--gold); }
    .usenames li.need { border-style: dashed; border-color: var(--bordeaux); color: var(--bordeaux); }
    .usenames li { display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; }
    .usenames li button { border: 0; background: transparent; color: var(--muted); font-size: .9rem; line-height: 1; padding: 0 4px; border-radius: 50%; }
    .usenames li button:hover { background: transparent; color: var(--bordeaux); }
    .usenames li.none { border: 0; background: transparent; color: var(--muted); padding: 0; }
  </style>
</head>
<body>
  <p><a href="index.html">← デザイン一覧へ戻る</a></p>
  <h1 id="title">デザイン</h1>
  <div class="hero" id="hero"></div>
  <p class="ops" id="ops"><button type="button" id="rename">編集</button> <button type="button" id="remove">削除</button></p>

  <div id="list"></div>


  <p id="msg" class="note"></p>

  <script src="../assets/config.js?v=202611102051"></script>
  <script src="../assets/app.js?v=202611102051"></script>
  <script>
    const $ = s => document.querySelector(s);
    let items = [];
    let images = []; // 差し替えた指示画像（シート designimages）
    const KINDS = ['ジェル', 'パーツ'];
    const photoSrc = p => /^(https?:|data:)/.test(p) ? p : '../' + p;
    const ph = i => i.photo && !String(i.photo).startsWith('text:')
      ? `<img class="ph" src="${ND.esc(photoSrc(i.photo))}" alt="" loading="lazy">`
      : '<span class="ph"></span>';

    // デザインキー → 表示名・ガイドページ・既定の指示画像
    const DESIGNS = {
      harvard: {
        name: 'Harvard Law Chic（SET02）',
        page: 'harvard-law-chic/index.html',
        defaults: {
          STEP2A: 'harvard-law-chic/images/right-hand-step2a.png',
          STEP2B: 'harvard-law-chic/images/left-hand-step2b.png'
        }
      }
    };

    // 指示画像の枠（どのデザインでも2枚）
    const SLOTS = [
      { slot: 'STEP2A', label: 'STEP 2A（右手）' },
      { slot: 'STEP2B', label: 'STEP 2B（左手）' }
    ];

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        let loaded = false;
        await Promise.all([
          ND.listFast(null, d => { items = d; loaded = true; render(); }),
          ND.listFast('designimages', d => { images = d; if (loaded) render(); }).catch(() => { images = []; })
        ]);
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    // 枠ごとの画像URL：差し替えたもの → 既定の画像 の順
    // 大きな画像は 45,000 文字ずつ「STEP2A#0, #1…」に分けて保存し、本体には「chunks:個数」を入れる
    function imageFor(key, slot) {
      const hit = images.find(x => x.design === key && x.slot === slot);
      const url = hit ? String(hit.url ?? '') : '';
      if (url.startsWith('chunks:')) {
        const n = parseInt(url.slice(7), 10);
        const parts = [];
        for (let k = 0; k < n; k++) {
          const c = images.find(x => x.design === key && x.slot === `${slot}#${k}`);
          if (!c) return '';
          parts.push(String(c.url));
        }
        return parts.join('');
      }
      if (url) return url;
      const d = DESIGNS[key];
      return d && d.defaults && d.defaults[slot] ? d.defaults[slot] : '';
    }

    // デザインの名前・削除の印は、指示画像と同じ表（designimages）に NAME / HIDDEN として持つ
    const metaOf = (key, slot) => String((images.find(x => x.design === key && x.slot === slot) || {}).url ?? '');
    const nameOf = key => metaOf(key, 'NAME') || (DESIGNS[key] || {}).name || key;
    const isHidden = key => metaOf(key, 'HIDDEN') === '1';
    function setMeta(key, slot, url) {
      const hit = images.find(x => x.design === key && x.slot === slot);
      if (hit) hit.url = url; else images.push({ design: key, slot, url });
    }

    function render() {
      const key = new URLSearchParams(location.search).get('d') || '';
      document.title = nameOf(key);
      $('#title').textContent = nameOf(key);
      if (isHidden(key)) {
        $('#list').innerHTML = '<p class="done">このデザインは削除されました。</p>';
        $('#ops').hidden = true;
        return;
      }
      const th = metaOf(key, 'THUMB');
      $('#hero').innerHTML = th ? `<img class="zoom" src="${ND.esc(th)}" alt="">` : '';
      $('#list').innerHTML = [key].map(key => {
        const d = DESIGNS[key] || { name: key };
        const need = items.filter(i => i.status !== '削除' && KINDS.includes(i.category) && ND.designsOf(i).includes(key));
        const have = need.filter(i => i.status === '持ち物');
        const missing = need.filter(i => i.status === '購入リスト');
        const low = have.filter(i => i.low);
        const tobuy = need.filter(i => i.status === '購入リスト');
        const pct = need.length ? Math.round(have.length / need.length * 100) : 0;
        const line = list => list.length
          ? list.map(i => `<li>${ND.esc(i.name)}${i.color ? '（' + ND.esc(i.color) + '）' : ''}</li>`).join('')
          : '<li>なし</li>';
        const steps = SLOTS.map(s => {
          const src = imageFor(key, s.slot);
          return `
            <figure class="step" style="margin:0">
              ${src
                ? `<img class="zoom" src="${ND.esc(src)}" alt="${ND.esc(s.label)}">`
                : `<div class="empty-img">写真を入れてください</div>`}
              <figcaption>${ND.esc(s.label)}</figcaption>
              <button type="button" data-act="pick" data-design="${ND.esc(key)}" data-slot="${s.slot}">写真を入れる・差し替える</button>
              <input type="file" accept="image/*" data-design="${ND.esc(key)}" data-slot="${s.slot}">
            </figure>`;
        }).join('');
        return `
          <div class="design-body">

              <h3>指示画像</h3>
              <div class="steps">${steps}</div>

              <h3>使うもの一覧<span class="meta" style="font-weight:400;margin-left:8px">${need.length ? need.length : ''}</span></h3>
              ${need.length ? `

                <ul class="uselist">${sortUses(need).map(useRow).join('')}</ul>
                ${tobuy.length ? '<p class="tolist"><a href="../tools/shopping.html">購入リストを開く ›</a></p>' : ''}
              ` : '<p class="uses-empty">まだ選んでいません</p>'}
              <p class="btnrow"><button type="button" class="choose main" data-wizard>＋ 使うものを入力</button></p>
          </div>`;
      }).join('');
    }

    // 少なめのうさぎ（持ち物リストと同じ形）
    const bunnyShapes = `
        <rect x="5.6" y="1.6" width="5.4" height="13.5" rx="2.7" transform="rotate(-11 8.3 15)"/>
        <rect x="13" y="1.6" width="5.4" height="13.5" rx="2.7" transform="rotate(11 15.7 15)"/>
        <ellipse cx="12" cy="19.4" rx="8" ry="7.2"/>`;
    const bunny = () => `<svg class="usa" viewBox="-1 -1 26 30" role="img" aria-label="すくなめ"><title>すくなめ</title>
      <g fill="#fff" stroke="#fff" stroke-width="3.4" stroke-linejoin="round">${bunnyShapes}</g>
      <g fill="#f5bccb">${bunnyShapes}</g>
      <g fill="#ec96ab"><rect x="7.4" y="4" width="1.8" height="8" rx=".9" transform="rotate(-11 8.3 15)"/><rect x="14.8" y="4" width="1.8" height="8" rx=".9" transform="rotate(11 15.7 15)"/></g></svg>`;

    // 並び順：ジェル → パーツ。同じ種類の中では、持っているもの → まだ買っていないもの
    const sortUses = list => [...list].sort((a, b) =>
      (KINDS.indexOf(a.category) - KINDS.indexOf(b.category)) ||
      ((a.status === '持ち物' ? 0 : 1) - (b.status === '持ち物' ? 0 : 1)));

    // 1つだけ別の持ち物に変える：一覧からタップで選ぶと、すぐ入れ替わる
    function openSwap(cur) {
      document.querySelector('#picker')?.remove();
      const d = document.createElement('dialog');
      d.id = 'picker';
      const cats = [cur.category, ...KINDS.filter(c => c !== cur.category)].filter(c => KINDS.includes(c));
      const opt = i => `<button type="button" class="opt${i.id === cur.id ? ' on' : ''}" data-id="${ND.esc(i.id)}">
          ${ph(i)}<span class="ck">✓</span><span class="nm">${ND.esc(i.name)}</span></button>`;
      const section = c => {
        const list = items.filter(i => i.category === c && i.status === '持ち物');
        return list.length ? `<h4>${c}</h4><div class="grid2">${list.map(opt).join('')}</div>` : '';
      };
      d.innerHTML = `<div class="wrap">
          <div class="form-head"><h3>「${ND.esc(cur.name)}」を変える</h3></div>
          <div class="pick-body">${cats.map(section).join('')}</div>
          <div class="form-foot"><button type="button" data-act="cancel">キャンセル</button></div>
        </div>`;
      document.body.appendChild(d);
      d.addEventListener('click', e => {
        if (e.target === d || e.target.closest('[data-act=cancel]')) return d.close();
        const o = e.target.closest('.opt');
        if (!o || o.dataset.id === cur.id) return;
        const to = items.find(i => i.id === o.dataset.id);
        d.close();
        // 今のものを外して、選んだものをこのデザインに付ける
        cur.designs = ND.designsOf(cur).filter(k => k !== KEY).join(', ');
        if (!ND.designsOf(to).includes(KEY)) to.designs = [...ND.designsOf(to), KEY].join(', ');
        render();
        ND.later(async () => {
          await ND.send('update', { id: cur.id, fields: { designs: cur.designs } });
          await ND.send('update', { id: to.id, fields: { designs: to.designs } });
        }, reload);
      });
      d.showModal();
    }

    // デザインから外す（持ち物そのものは消さない）
    function unlink(i) {
      i.designs = ND.designsOf(i).filter(k => k !== KEY).join(', ');
      render();
      ND.later(() => ND.send('update', { id: i.id, fields: { designs: i.designs } }), reload);
    }

    // 使うもの一覧の1行：・名前　写真（まだ買っていないものは点線の丸）
    const useRow = i => {
      const owned = i.status === '持ち物';
      return `
      <li class="${owned ? 'own' : 'need'}">
        <button type="button" class="urow" data-item="${ND.esc(i.id)}" aria-label="${ND.esc(i.name)}を編集">
          <span class="un">${ND.esc(i.name)}${owned ? '' : `<small>${ND.esc([i.category, i.shop].filter(Boolean).join(' ／ '))}</small>`}</span>
        </button>
        ${owned ? '' : `<button type="button" class="bought" data-bought="${ND.esc(i.id)}">買った</button>`}
        <span class="circ" data-item="${ND.esc(i.id)}">${owned ? ph(i) : '<span class="ph"></span>'}${owned && i.low ? bunny() : ''}</span>
      </li>`;
    };

    // 持っているもの：丸い写真
    const useTile = i => `
      <button type="button" class="use" data-item="${ND.esc(i.id)}" aria-label="${ND.esc(i.name)}を編集">
        ${ph(i)}${i.low ? bunny() : ''}
        <span class="nm">${ND.esc(i.name)}</span>
      </button>`;

    // これから買うもの：小さな丸＋名前＋カテゴリ・購入先
    const buyRow = i => `
      <li>
        <button type="button" class="brow" data-item="${ND.esc(i.id)}" aria-label="${ND.esc(i.name)}を編集">${ph(i)}
          <span class="bt"><span class="bn">${ND.esc(i.name)}</span><small>${ND.esc([i.category, i.color, i.shop].filter(Boolean).join(' ／ '))}</small></span>
        </button>
        <button type="button" class="bought" data-bought="${ND.esc(i.id)}">買った</button>
      </li>`;

    // 使うものを選ぶシート（ジェル・パーツを丸で並べて、タップで選ぶ）
    function openPicker(selected, title, onDone) {
      document.querySelector('#picker')?.remove();
      const sel = new Set(selected);
      const d = document.createElement('dialog');
      d.id = 'picker';
      const opt = i => `<button type="button" class="opt${sel.has(i.id) ? ' on' : ''}" data-id="${ND.esc(i.id)}" aria-pressed="${sel.has(i.id)}">
          ${ph(i)}<span class="ck">✓</span><span class="nm">${ND.esc(i.name)}</span></button>`;
      const section = c => {
        const list = items.filter(i => i.category === c && i.status !== '削除');
        list.sort((a, b) => (a.status === '持ち物' ? 0 : 1) - (b.status === '持ち物' ? 0 : 1));
        return list.length ? `<h4>${c}</h4><div class="grid2">${list.map(opt).join('')}</div>` : '';
      };
      d.innerHTML = `<div class="wrap">
          <div class="form-head"><h3>${ND.esc(title)}<span class="count"></span></h3></div>
          <div class="pick-body">${KINDS.map(section).join('')}</div>
          <div class="form-foot"><button type="button" data-act="cancel">キャンセル</button><button type="button" data-act="ok" style="background:var(--bordeaux);color:#fff">決定</button></div>
        </div>`;
      document.body.appendChild(d);
      const count = () => { d.querySelector('.count').textContent = sel.size + '個'; };
      count();
      d.addEventListener('click', e => {
        if (e.target === d) return d.close();
        const o = e.target.closest('.opt');
        if (o) {
          const id = o.dataset.id;
          sel.has(id) ? sel.delete(id) : sel.add(id);
          o.classList.toggle('on', sel.has(id));
          o.setAttribute('aria-pressed', sel.has(id));
          return count();
        }
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'cancel') d.close();
        if (act === 'ok') { d.close(); onDone(sel); }
      });
      d.showModal();
    }

    // デザインに使うものを保存（変わった持ち物の designs 列だけ書き換える）
    function applyUses(key, sel) {
      const changed = [];
      items.filter(i => KINDS.includes(i.category)).forEach(i => {
        const keys = ND.designsOf(i);
        const has = keys.includes(key), want = sel.has(i.id);
        if (has === want) return;
        const next = want ? [...keys, key] : keys.filter(k => k !== key);
        i.designs = next.join(', ');
        changed.push(i);
      });
      if (!changed.length) return;
      render();
      ND.later(async () => {
        for (const i of changed) await ND.send('update', { id: i.id, fields: { designs: i.designs } });
      }, reload);
    }

    $('#list').addEventListener('click', e => {
      const b = e.target.closest('button[data-choose]');
      if (!b) return;
      const key = b.dataset.choose;
      const current = items.filter(i => ND.designsOf(i).includes(key)).map(i => i.id);
      openPicker(current, nameOf(key), sel => applyUses(key, sel));
    });


    // 「写真を入れる」ボタンで、対応する入力欄を開く
    $('#list').addEventListener('click', e => {
      const b = e.target.closest('button[data-act="pick"]');
      if (!b) return;
      const input = b.parentElement.querySelector('input[type=file]');
      input.click();
    });

    // 写真を選んだら、軽くしてドライブに保存し、枠に登録する
    $('#list').addEventListener('change', async e => {
      const input = e.target;
      if (input.type !== 'file') return;
      const file = input.files[0];
      if (!file) return;
      const { design, slot } = input.dataset;
      try {
        // 長辺1400pxに縮めて、まず画面に出す。保存は裏で分けて送る
        const data = await ND.imageData(file, 1400, .8);
        const SIZE = 45000;
        const chunks = [];
        for (let k = 0; k < data.length; k += SIZE) chunks.push(data.slice(k, k + SIZE));
        chunks.forEach((c, k) => setMeta(design, `${slot}#${k}`, c));
        setMeta(design, slot, 'chunks:' + chunks.length);
        render();
        ND.later(async () => {
          for (let k = 0; k < chunks.length; k++) {
            await ND.send('setDesignImage', { design, slot: `${slot}#${k}`, url: chunks[k] });
          }
          await ND.send('setDesignImage', { design, slot, url: 'chunks:' + chunks.length });
        }, reload);
      } catch (err) {
        alert('写真を読み込めませんでした: ' + err.message);
      }
      input.value = '';
    });

    const KEY = new URLSearchParams(location.search).get('d') || '';

    // 写真（サムネイル・指示画像）は押すと拡大
    document.addEventListener('click', e => { if (e.target.matches('img.zoom')) ND.lightbox(e.target.src, e.target.alt); });

    // ---------- 使うものを入力する3ステップ ----------
    // 1. 使うものを自分で書く → 2. 1つずつ、対応する持ち物を選ぶ（なければ「持っていない」）→ 3. 確認して登録
    const PART_WORDS = ['シール', 'ステッカー', 'パーツ', 'ストーン', 'パール', 'スタッズ', 'リボン', 'ホロ', 'ビーズ', 'チェーン', 'ホイル', 'ライン', 'スパンコール'];
    const guessCat = t => PART_WORDS.some(w => t.includes(w)) ? 'パーツ' : 'ジェル';
    // 書いた言葉と持ち物の近さ（2文字ずつの重なりの数）
    const bigrams = t => { const x = String(t || '').replace(/\s+/g, ''); const r = []; for (let k = 0; k < x.length - 1; k++) r.push(x.slice(k, k + 2)); return r; };
    const score = (want, i) => {
      const hay = [i.name, i.desc, i.color, i.colortag, i.texture, i.parttype].join(' ');
      return bigrams(want).filter(g => hay.includes(g)).length;
    };

    function openWizard(onDone) {
      document.querySelector('#new-dlg')?.remove();
      const d = document.createElement('dialog');
      d.id = 'new-dlg';
      document.body.appendChild(d);
      let wants = [];          // 書いた使うもの
      let picks = [];          // それぞれの答え：{ id } / { none: true, cat }
      let step = 1, idx = 0;
      const pool = () => items.filter(i => KINDS.includes(i.category) && i.status !== '削除');

      const draw = () => {
        if (step === 1) {
          d.innerHTML = `<form>
            <div class="form-head" tabindex="-1" autofocus><h3>使うものを入力<span class="count">1 / 3</span></h3></div>
            <div class="form-body">
              <label>使うもの（1行に1つ）<textarea name="wants" rows="8" placeholder="ボルドーのジェル\nミルキーなピンク\nゴールドのスタッズ">${ND.esc(wants.join('\n'))}</textarea></label>
            </div>
            <div class="form-foot"><button type="button" data-x>キャンセル</button><button type="submit">次へ</button></div></form>`;
        } else if (step === 2) {
          const want = wants[idx];
          const cur = picks[idx] || {};
          const list = pool().map(i => ({ i, sc: score(want, i) }))
            .sort((a, b) => (b.sc - a.sc) || ((a.i.status === '持ち物' ? 0 : 1) - (b.i.status === '持ち物' ? 0 : 1)));
          const opt = ({ i }) => `<button type="button" class="opt${cur.id === i.id ? ' on' : ''}" data-id="${ND.esc(i.id)}">
              ${ph(i)}<span class="ck">✓</span><span class="nm">${ND.esc(i.name)}</span>${i.status === '持ち物' ? '' : '<span class="nb">未購入</span>'}</button>`;
          const cat = cur.cat || guessCat(want);
          d.innerHTML = `<form>
            <div class="form-head" tabindex="-1" autofocus><h3>対応するものを選ぶ<span class="count">2 / 3</span></h3></div>
            <div class="form-body">
              <p class="want"><span>${idx + 1} / ${wants.length}</span>${ND.esc(want)}</p>
              <button type="button" class="nothave${cur.none ? ' on' : ''}" data-none>持っていない（購入リストに入れる）</button>
              ${cur.none ? `<div class="catpick">${KINDS.map(c => `<button type="button" data-cat="${c}" class="${cat === c ? 'on' : ''}">${c}</button>`).join('')}</div>` : ''}
              <h4 class="sub">持ち物から選ぶ</h4>
              <div class="grid2">${list.map(opt).join('')}</div>
            </div>
            <div class="form-foot"><button type="button" data-back>戻る</button><button type="submit">${idx + 1 < wants.length ? '次へ' : '確認へ'}</button></div></form>`;
        } else {
          const row = (w, k) => {
            const p = picks[k] || {};
            const it = p.id && items.find(i => i.id === p.id);
            return `<li><span class="w">${ND.esc(w)}</span><span class="arrow">→</span>${it
              ? `<span class="r">${ND.esc(it.name)}</span>`
              : `<span class="r need">購入リストに追加（${ND.esc(p.cat || guessCat(w))}）</span>`}</li>`;
          };
          d.innerHTML = `<form>
            <div class="form-head" tabindex="-1" autofocus><h3>確認<span class="count">3 / 3</span></h3></div>
            <div class="form-body"><ul class="confirm">${wants.map(row).join('')}</ul></div>
            <div class="form-foot"><button type="button" data-back>戻る</button><button type="submit">登録する</button></div></form>`;
        }
        d.querySelector('[data-x]')?.addEventListener('click', () => d.close());
        d.querySelector('form').onsubmit = submit;
      };

      const submit = e => {
        e.preventDefault();
        if (step === 1) {
          wants = new FormData(e.target).get('wants').split('\n').map(t => t.trim()).filter(Boolean);
          if (!wants.length) return;
          picks = wants.map((w, k) => picks[k] || {});
          step = 2; idx = 0;
        } else if (step === 2) {
          if (!picks[idx].id && !picks[idx].none) picks[idx] = { none: true, cat: guessCat(wants[idx]) };
          if (idx + 1 < wants.length) idx++; else step = 3;
        } else {
          return finish();
        }
        draw();
        d.querySelector('.form-body').scrollTop = 0;
      };

      d.addEventListener('click', e => {
        if (e.target === d) return;
        const o = e.target.closest('.opt');
        if (o) { picks[idx] = picks[idx]?.id === o.dataset.id ? {} : { id: o.dataset.id }; return draw(); }
        if (e.target.closest('[data-none]')) { picks[idx] = picks[idx]?.none ? {} : { none: true, cat: guessCat(wants[idx]) }; return draw(); }
        const c = e.target.closest('[data-cat]');
        if (c) { picks[idx] = { none: true, cat: c.dataset.cat }; return draw(); }
        if (e.target.closest('[data-back]')) {
          if (step === 3) { step = 2; idx = wants.length - 1; }
          else if (idx > 0) idx--;
          else step = 1;
          draw();
        }
      });

      // 登録：選んだ持ち物にこのデザインを付け、持っていないものは購入リストへ
      const finish = () => {
        const link = [], adds = [];
        wants.forEach((w, k) => {
          const p = picks[k] || {};
          const it = p.id && items.find(i => i.id === p.id);
          if (it) {
            if (!ND.designsOf(it).includes(KEY)) { it.designs = [...ND.designsOf(it), KEY].join(', '); link.push(it); }
          } else {
            const item = { name: w, category: p.cat || guessCat(w), status: '購入リスト', low: false, designs: KEY };
            adds.push(item);
            items.push({ ...item, id: 'tmp' + Date.now() + k });
          }
        });
        d.close();
        render();
        if (onDone) onDone();
        ND.later(async () => {
          for (const i of link) await ND.send('update', { id: i.id, fields: { designs: i.designs } });
          for (const item of adds) await ND.send('add', { item });
        }, reload);
      };

      draw();
      d.showModal();
    }

    // 使うもの・買うものをタップしたら、その場で編集（削除も）
    $('#list').addEventListener('click', e => {
      const t = e.target.closest('[data-item]');
      if (t) {
        const i = items.find(x => x.id === t.dataset.item);
        if (!i) return;
        return ND.openEditor(i, f => {
          Object.assign(i, f);
          render();
          ND.later(() => ND.send('update', { id: i.id, fields: f }), reload);
        }, { onSwap: () => openSwap(i), onUnlink: () => unlink(i), onDelete: () => { ND.removeItem(i, reload); render(); } });
      }
      const bt = e.target.closest('[data-bought]');
      if (bt) {
        const i = items.find(x => x.id === bt.dataset.bought);
        if (!i) return;
        i.status = '持ち物';
        i.low = false;
        render();
        return ND.later(async () => {
          await ND.send('setStatus', { id: i.id, status: '持ち物' });
          await ND.send('setLow', { id: i.id, low: false });
        }, reload);
      }
      if (e.target.closest('[data-wizard]')) return openWizard();
      const ab = e.target.closest('[data-addbuy]');
      if (ab) {
        ND.openEditor(null, f => {
          const item = { ...f, status: '購入リスト', low: false, designs: KEY };
          items.push({ ...item, id: 'tmp' + Date.now() });
          render();
          ND.later(() => ND.send('add', { item }), reload);
        });
      }
    });

    // 編集：デザイン名を変える
    $('#rename').onclick = () => {
      document.querySelector('#nd-dlg')?.remove();
      const d = document.createElement('dialog');
      d.id = 'nd-dlg';
      d.innerHTML = `<form>
          <div class="form-head" tabindex="-1" autofocus><h3>デザインを編集</h3></div>
          <div class="form-body"><label>デザイン名<input name="name" required value="${ND.esc(nameOf(KEY))}"></label>
            <label>サムネイル写真<span class="thumbpick"><span class="tprev" data-tprev>${metaOf(KEY, 'THUMB') ? `<img src="${metaOf(KEY, 'THUMB')}" alt="">` : ''}</span><input type="file" accept="image/*" name="thumb"><span class="tbtns"><button type="button" data-tadjust>位置を調整</button><button type="button" data-tclear>外す</button></span></span></label></div>
          <div class="form-foot"><button type="button" data-x>キャンセル</button><button type="submit">保存</button></div>
        </form>`;
      document.body.appendChild(d);
      d.querySelector('[data-x]').onclick = () => d.close();
      let thumb = null;                       // null：変えない ／ ''：外す ／ 画像：新しいサムネイル
      const showT = () => {
        const t = thumb ?? metaOf(KEY, 'THUMB');
        d.querySelector('[data-tprev]').innerHTML = t ? `<img src="${t}" alt="">` : '';
      };
      // 写真を選んだら、そのまま切り抜き画面へ
      d.querySelector('input[name=thumb]').addEventListener('change', async e => {
        const f = e.target.files[0];
        e.target.value = '';
        if (!f) return;
        const out = await ND.cropImage(await ND.imageData(f, 1600, .9));
        if (out) { thumb = out; showT(); }
      });
      d.querySelector('[data-tadjust]').onclick = async () => {
        const t = thumb ?? metaOf(KEY, 'THUMB');
        if (!t) return d.querySelector('input[name=thumb]').click();
        const out = await ND.cropImage(t);
        if (out) { thumb = out; showT(); }
      };
      d.querySelector('[data-tclear]').onclick = () => { thumb = ''; showT(); };
      d.querySelector('form').onsubmit = e => {
        e.preventDefault();
        const name = new FormData(e.target).get('name').trim();
        if (!name) return;
        setMeta(KEY, 'NAME', name);
        if (thumb !== null) setMeta(KEY, 'THUMB', thumb);
        d.close();
        render();
        ND.later(async () => {
          await ND.send('setDesignImage', { design: KEY, slot: 'NAME', url: name });
          if (thumb !== null) await ND.send('setDesignImage', { design: KEY, slot: 'THUMB', url: thumb });
        }, reload);
      };
      d.showModal();
    };

    // 削除：デザインを一覧から消し、持ち物との紐づけも外す
    $('#remove').onclick = async () => {
      if (!confirm(`「${nameOf(KEY)}」を削除しますか？`)) return;
      const b = $('#remove');
      b.disabled = true;
      b.textContent = '削除しています…';
      try {
        await ND.send('setDesignImage', { design: KEY, slot: 'HIDDEN', url: '1' });
        for (const i of items.filter(i => ND.designsOf(i).includes(KEY))) {
          await ND.send('update', { id: i.id, fields: { designs: ND.designsOf(i).filter(k => k !== KEY).join(', ') } });
        }
        location.href = 'index.html';
      } catch (err) {
        alert('削除できませんでした: ' + err.message);
        b.disabled = false;
        b.textContent = '削除';
      }
    };

    reload().then(() => {
      // 新しいデザインを作った直後は、そのまま「使うものを入力」を開く
      if (new URLSearchParams(location.search).get('setup') === '1') {
        history.replaceState(null, '', `view.html?d=${encodeURIComponent(KEY)}`);
        openWizard();
      }
    });
  </script>
</body>
</html>
