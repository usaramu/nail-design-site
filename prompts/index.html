<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指示プロンプト</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611112114">
  <style>
    /* タイトルだけの一覧。タップで本文とボタンが開く */
    #list { border-bottom: 1px solid var(--line); }
    .prompt { padding: 0; }
    .prompt .ttl {
      display: flex; width: 100%; align-items: center; gap: 10px; text-align: left;
      border: 0; border-radius: 0; background: transparent; color: var(--ink);
      padding: 15px 2px; font-family: var(--serif); font-weight: 700; font-size: 1rem; letter-spacing: .03em;
    }
    .prompt .ttl:hover { background: transparent; color: var(--bordeaux); }
    .prompt .ttl span { flex: 1; }
    .prompt .ttl::after { content: '＋'; font-family: var(--sans); font-weight: 300; color: var(--muted); }
    .prompt.open .ttl::after { content: '－'; }
    .prompt .body { display: none; padding: 0 0 18px; }
    .prompt.open .body { display: block; }
    .prompt.open pre { max-height: none; margin-top: 12px; }
    .prompt .actions { margin: 0; }
    .topbtns button { margin-right: 6px; }
    mark.inv {
      background: #fbdbe2; color: var(--bordeaux); font-weight: 500;
      padding: 0 6px; border-radius: 999px; font-size: .9em;
    }
    /* 編集画面：重ねて出さず、ふつうのページとして表示（iPhone でカーソルやタップがずれないように） */
    body.editing #main { display: none; }
    body.editing { padding-top: 0; }
    .ed-bar button[type=submit], .ed-bar .primary { background: var(--bordeaux); color: #fff; border-color: var(--bordeaux); }
    #pr-edit[hidden] { display: none; }
    .ed-bar {
      position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
      margin: 0 -20px 14px; padding: 10px 20px; background: var(--surface, #fff);
      border-bottom: 1px solid var(--line);
    }
    .ed-bar h3 { flex: 1; margin: 0 !important; text-align: center; font-size: 1rem; }
    .ed-bar button { padding: 8px 16px; border-radius: 10px; font-size: .92rem; }
    #pr-edit label { display: block; margin-top: 12px; }
    #pr-edit input, #pr-edit textarea { font-size: 16px; width: 100%; box-sizing: border-box; }
    #pr-edit textarea { resize: none; overflow: hidden; line-height: 1.7; min-height: 40vh; }
    .ed-label { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
    /* 持ち物を選んでコピー */
    body.picking #main { display: none; }
    body.picking { padding-top: 0; }
    #pick[hidden] { display: none; }
    #pick h2 { display: flex; align-items: baseline; justify-content: space-between; font-size: 1rem; margin: 18px 0 10px; border: 0; padding: 0; }
    #pick h2 button { border: 0; background: transparent; padding: 2px 0; font-size: .8rem; color: var(--bordeaux); text-decoration: underline; text-underline-offset: 3px; }
    .pk-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 10px; }
    .pk {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px;
      border: 0; background: transparent; padding: 0; color: var(--ink); min-width: 0;
    }
    .pk:hover { background: transparent; }
    .pk .ph {
      width: 60px; height: 60px; border-radius: 50%; object-fit: cover; display: grid; place-items: center;
      background: #f3e9ea; border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 2px;
      font-size: .72rem; color: var(--bordeaux); overflow: hidden; transition: opacity .15s;
    }
    .pk.part .ph { border-radius: 12px; }
    .pk .nm { font-size: .68rem; line-height: 1.35; width: 100%; text-align: center; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pk:not(.on) .ph { opacity: .35; }
    .pk:not(.on) .nm { opacity: .55; }
    .pk.on .ph { outline-color: var(--bordeaux); }
    .pk.on::after {
      content: '✓'; position: absolute; top: -4px; right: calc(50% - 36px); width: 20px; height: 20px; border-radius: 50%;
      background: var(--bordeaux); color: #fff; font-size: .7rem; display: grid; place-items: center;
    }
    .insert button { font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="main">
  <p><a href="../index.html">← ホームへ戻る</a></p>
  <h1>指示プロンプト</h1>
  <p class="topbtns"><button id="add">＋ プロンプトを追加</button> <button id="copyinv">持ち物をコピー</button></p>

  <div id="list"></div>
  <p id="msg" class="note"></p>
  </div>

  <div id="pick" hidden>
    <div class="ed-bar">
      <button type="button" id="pk-cancel">キャンセル</button>
      <h3 id="pk-head">持ち物を選ぶ</h3>
      <button type="button" id="pk-copy" class="primary">コピー</button>
    </div>
    <div id="pk-list"></div>
  </div>

  <form id="pr-edit" hidden>
    <div class="ed-bar">
      <button type="button" id="pr-cancel">キャンセル</button>
      <h3 id="pr-head">編集</h3>
      <button type="submit">保存</button>
    </div>
    <label>タイトル<input name="title" required></label>
    <div class="ed-label"><span>プロンプト本文</span><span class="insert"><button type="button" id="pr-inv">＋ 持ち物を差し込む</button></span></div>
    <textarea name="body" required aria-label="プロンプト本文"></textarea>
  </form>

  <script src="../assets/config.js?v=202611112114"></script>
  <script src="../assets/app.js?v=202611112114"></script>
  <script>
    const $ = s => document.querySelector(s);
    let prompts = [];
    let items = [];   // 持ち物（{持ち物} の差し込み用）
    const TOKEN_INV = '{持ち物}';
    const fill = body => String(body || '').split(TOKEN_INV).join(ND.inventoryText(items));

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        await Promise.all([
          ND.listFast('prompts', d => { prompts = d; render(); }),
          ND.listFast(null, d => { items = d; })
        ]);
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      $('#list').innerHTML = prompts.length
        ? prompts.map(p => `
            <div class="prompt" data-id="${ND.esc(p.id)}">
              <button type="button" class="ttl" data-act="toggle"><span>${ND.esc(p.title || '（無題）')}</span></button>
              <div class="body">
                <div class="actions">
                  <button data-act="copy">全文コピー</button>
                  ${String(p.body).includes(TOKEN_INV) ? '<button data-act="pick">選んでコピー</button>' : ''}
                  <button data-act="edit">編集</button>
                  <button data-act="delete">削除</button>
                </div>
                <pre>${ND.esc(p.body).split(ND.esc(TOKEN_INV)).join('<mark class="inv">持ち物</mark>')}</pre>
              </div>
            </div>`).join('')
        : '<p class="empty">まだありません。</p>';
    }

    // 全文コピー・全文表示・編集・削除
    $('#list').addEventListener('click', async e => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const card = b.closest('.prompt');
      const p = prompts.find(x => x.id === card.dataset.id);
      if (!p) return;

      if (b.dataset.act === 'toggle') {
        card.classList.toggle('open');
        return;
      }
      if (b.dataset.act === 'copy') {
        await ND.copyText(fill(p.body));
        b.textContent = 'コピーしました';
        setTimeout(() => { b.textContent = '全文コピー'; }, 1500);
        return;
      }
      if (b.dataset.act === 'pick') {
        return openPick(p);
      }
      if (b.dataset.act === 'edit') {
        return openForm(p);
      }
      if (b.dataset.act === 'delete') {
        if (!confirm(`「${p.title || '（無題）'}」を削除しますか？`)) return;
        prompts = prompts.filter(x => x !== p);
        render();
        ND.later(() => ND.send('deletePrompt', { id: p.id }), reload);
      }
    });

    // 追加・編集（ページを切り替えて表示）
    const form = $('#pr-edit'), ta = form.querySelector('textarea');
    let editing = null, backY = 0;
    const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    ta.addEventListener('input', grow);

    function openForm(p) {
      editing = p;
      backY = scrollY;
      $('#pr-head').textContent = p ? '編集' : '追加';
      form.title.value = p?.title || '';
      ta.value = p?.body || '';
      document.body.classList.add('editing');
      form.hidden = false;
      scrollTo(0, 0);
      grow();
    }
    function closeForm() {
      form.hidden = true;
      document.body.classList.remove('editing');
      document.activeElement?.blur();
      scrollTo(0, backY);
    }
    $('#pr-cancel').onclick = closeForm;
    // カーソルの位置に {持ち物} を入れる（コピーするとき今の持ち物一覧に置き換わる）
    $('#pr-inv').addEventListener('pointerdown', e => e.preventDefault()); // 押してもキーボードが閉じない
    $('#pr-inv').onclick = () => {
      const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
      ta.value = ta.value.slice(0, a) + TOKEN_INV + ta.value.slice(b);
      ta.focus();
      ta.setSelectionRange(a + TOKEN_INV.length, a + TOKEN_INV.length);
      grow();
    };
    form.onsubmit = e => {
      e.preventDefault();
      const p = editing;
      const fields = { title: form.title.value.trim(), body: ta.value.trim() };
      if (p) {
        Object.assign(p, fields);
        ND.later(() => ND.send('updatePrompt', { id: p.id, ...fields }), reload);
      } else {
        prompts.push({ id: 'tmp' + Date.now(), ...fields });
        ND.later(() => ND.send('addPrompt', fields), reload);
      }
      render();
      closeForm();
    };

    // 持ち物を選んでコピー（前回選んだものを覚えておく）
    const photoSrc = ph => /^(https?:|data:)/.test(ph) ? ph : '../' + ph;
    const pickKey = p => 'nd_pick_' + p.id;
    let picking = null, chosen = new Set();
    function openPick(p) {
      picking = p;
      backY = scrollY;
      const mine = items.filter(i => i.status === '持ち物');
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(pickKey(p)) || 'null'); } catch {}
      chosen = new Set(saved ? saved.filter(id => mine.some(i => i.id === id)) : []);
      const tile = i => {
        const ph = String(i.photo || '');
        const vis = ph.startsWith('text:') ? `<span class="ph">${ND.esc(ph.slice(5))}</span>`
          : ph ? `<img class="ph" src="${ND.esc(photoSrc(ph))}" alt="" loading="lazy">` : '<span class="ph"></span>';
        return `<button type="button" class="pk ${i.category === 'パーツ' ? 'part' : ''} ${chosen.has(i.id) ? 'on' : ''}" data-id="${ND.esc(i.id)}" aria-pressed="${chosen.has(i.id)}">${vis}<span class="nm">${ND.esc(i.name)}</span></button>`;
      };
      $('#pk-list').innerHTML = ['ジェル', 'パーツ'].map(c => {
        const g = mine.filter(i => i.category === c);
        return g.length ? `<h2>${c}<button type="button" data-all="${c}">すべて選ぶ</button></h2><div class="pk-grid">${g.map(tile).join('')}</div>` : '';
      }).join('') || '<p class="empty">持ち物がまだありません。</p>';
      refreshPick();
      document.body.classList.add('picking');
      $('#pick').hidden = false;
      scrollTo(0, 0);
    }
    function refreshPick() {
      document.querySelectorAll('#pick .pk').forEach(el => {
        const on = chosen.has(el.dataset.id);
        el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
      });
      document.querySelectorAll('#pick [data-all]').forEach(btn => {
        const ids = items.filter(i => i.status === '持ち物' && i.category === btn.dataset.all).map(i => i.id);
        btn.textContent = ids.every(id => chosen.has(id)) ? 'すべて外す' : 'すべて選ぶ';
      });
      $('#pk-head').textContent = chosen.size ? `${chosen.size}個 選択中` : '持ち物を選ぶ';
    }
    function closePick() {
      $('#pick').hidden = true;
      document.body.classList.remove('picking');
      scrollTo(0, backY);
    }
    $('#pk-list').addEventListener('click', e => {
      const all = e.target.closest('[data-all]');
      if (all) {
        const ids = items.filter(i => i.status === '持ち物' && i.category === all.dataset.all).map(i => i.id);
        const every = ids.every(id => chosen.has(id));
        ids.forEach(id => every ? chosen.delete(id) : chosen.add(id));
        return refreshPick();
      }
      const t = e.target.closest('.pk');
      if (!t) return;
      chosen.has(t.dataset.id) ? chosen.delete(t.dataset.id) : chosen.add(t.dataset.id);
      refreshPick();
    });
    $('#pk-cancel').onclick = closePick;
    $('#pk-copy').onclick = async e => {
      const b = e.currentTarget;
      if (!chosen.size) { $('#pk-head').textContent = '1つ以上選んでね'; return; }
      const sel = items.filter(i => chosen.has(i.id));
      try { localStorage.setItem(pickKey(picking), JSON.stringify([...chosen])); } catch {}
      await ND.copyText(String(picking.body || '').split(TOKEN_INV).join(ND.inventoryText(sel)));
      b.textContent = 'コピーしました';
      setTimeout(() => { b.textContent = 'コピー'; closePick(); }, 900);
    };

    $('#add').onclick = () => openForm(null);
    $('#copyinv').onclick = async e => {
      const b = e.currentTarget;
      await ND.copyText(ND.inventoryText(items));
      b.textContent = 'コピーしました';
      setTimeout(() => { b.textContent = '持ち物をコピー'; }, 1500);
    };

    reload();
  </script>
</body>
</html>
