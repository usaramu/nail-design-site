<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指示プロンプト</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611101751">
  <style>
    /* タイトルだけの一覧。タップで本文とボタンが開く */
    #list { border-bottom: 1px solid var(--line); }
    .prompt { padding: 0; }
    .prompt .ttl {
      display: flex; width: 100%; align-items: center; gap: 10px; text-align: left;
      border: 0; border-radius: 0; background: transparent; color: var(--ink);
      padding: 15px 2px; font-family: var(--serif); font-weight: 700; font-size: 1rem; letter-spacing: .03em;
    }
    .prompt .ttl:hover { background: transparent; color: var(--bordeaux); }
    .prompt .ttl span { flex: 1; }
    .prompt .ttl::after { content: '＋'; font-family: var(--sans); font-weight: 300; color: var(--muted); }
    .prompt.open .ttl::after { content: '－'; }
    .prompt .body { display: none; padding: 0 0 18px; }
    .prompt.open .body { display: block; }
    .prompt.open pre { max-height: none; margin-top: 0; }
  </style>
</head>
<body>
  <p><a href="../index.html">← ホームへ戻る</a></p>
  <h1>指示プロンプト</h1>
  <p><button id="add">＋ プロンプトを追加</button></p>

  <div id="list"></div>
  <p id="msg" class="note"></p>

  <script src="../assets/config.js?v=202611101751"></script>
  <script src="../assets/app.js?v=202611101751"></script>
  <script>
    const $ = s => document.querySelector(s);
    let prompts = [];

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        prompts = await ND.list('prompts');
        render();
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      $('#list').innerHTML = prompts.length
        ? prompts.map(p => `
            <div class="prompt" data-id="${ND.esc(p.id)}">
              <button type="button" class="ttl" data-act="toggle"><span>${ND.esc(p.title || '（無題）')}</span></button>
              <div class="body">
                <pre>${ND.esc(p.body)}</pre>
                <div class="actions">
                  <button data-act="copy">全文コピー</button>
                  <button data-act="edit">編集</button>
                  <button data-act="delete">削除</button>
                </div>
              </div>
            </div>`).join('')
        : '<p class="empty">まだありません。</p>';
    }

    // 全文コピー・全文表示・編集・削除
    $('#list').addEventListener('click', async e => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const card = b.closest('.prompt');
      const p = prompts.find(x => x.id === card.dataset.id);
      if (!p) return;

      if (b.dataset.act === 'toggle') {
        card.classList.toggle('open');
        return;
      }
      if (b.dataset.act === 'copy') {
        await ND.copyText(p.body);
        b.textContent = 'コピーしました';
        setTimeout(() => { b.textContent = '全文コピー'; }, 1500);
        return;
      }
      if (b.dataset.act === 'edit') {
        return openForm(p);
      }
      if (b.dataset.act === 'delete') {
        if (!confirm(`「${p.title || '（無題）'}」を削除しますか？`)) return;
        try {
          await ND.send('deletePrompt', { id: p.id });
          await reload();
        } catch (err) {
          alert('削除できませんでした: ' + err.message);
        }
      }
    });

    // 追加・編集フォーム（タイトルと本文）
    function openForm(p) {
      document.querySelector('#pr-dlg')?.remove();
      const dlg = document.createElement('dialog');
      dlg.id = 'pr-dlg';
      dlg.innerHTML = `
        <form id="pr-form" style="width:min(92vw,560px)">
          <h3 style="color:#7a1f2b;margin:0 0 4px">${p ? '編集' : '追加'}</h3>
          <label style="display:block;font-size:.85rem;margin-top:10px">タイトル
            <input name="title" required value="${ND.esc(p?.title || '')}" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #d6c5bd;border-radius:6px;font:inherit;margin-top:4px">
          </label>
          <label style="display:block;font-size:.85rem;margin-top:10px">プロンプト本文
            <textarea name="body" required rows="12" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #d6c5bd;border-radius:6px;font:inherit;margin-top:4px">${ND.esc(p?.body || '')}</textarea>
          </label>
          <div class="btns" style="text-align:right;margin-top:14px">
            <button type="button" id="pr-cancel">キャンセル</button>
            <button type="submit" style="background:#7a1f2b;color:#fff;border-color:#7a1f2b">保存</button>
          </div>
        </form>`;
      document.body.appendChild(dlg);
      dlg.querySelector('#pr-cancel').onclick = () => dlg.close();
      dlg.querySelector('#pr-form').onsubmit = async e => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        const fields = { title: f.title.trim(), body: f.body.trim() };
        try {
          if (p) await ND.send('updatePrompt', { id: p.id, ...fields });
          else await ND.send('addPrompt', fields);
          dlg.close();
          await reload();
        } catch (err) {
          alert('保存できませんでした: ' + err.message);
        }
      };
      dlg.showModal();
    }

    $('#add').onclick = () => openForm(null);

    reload();
  </script>
</body>
</html>
