<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>指示プロンプト</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611110238">
  <style>
    /* タイトルだけの一覧。タップで本文とボタンが開く */
    #list { border-bottom: 1px solid var(--line); }
    .prompt { padding: 0; }
    .prompt .ttl {
      display: flex; width: 100%; align-items: center; gap: 10px; text-align: left;
      border: 0; border-radius: 0; background: transparent; color: var(--ink);
      padding: 15px 2px; font-family: var(--serif); font-weight: 700; font-size: 1rem; letter-spacing: .03em;
    }
    .prompt .ttl:hover { background: transparent; color: var(--bordeaux); }
    .prompt .ttl span { flex: 1; }
    .prompt .ttl::after { content: '＋'; font-family: var(--sans); font-weight: 300; color: var(--muted); }
    .prompt.open .ttl::after { content: '－'; }
    .prompt .body { display: none; padding: 0 0 18px; }
    .prompt.open .body { display: block; }
    .prompt.open pre { max-height: none; margin-top: 0; }
    .topbtns button { margin-right: 6px; }
    mark.inv {
      background: #fbdbe2; color: var(--bordeaux); font-weight: 500;
      padding: 0 6px; border-radius: 999px; font-size: .9em;
    }
    .insert { margin: 8px 0 0; }
    .insert button { font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
  </style>
</head>
<body>
  <p><a href="../index.html">← ホームへ戻る</a></p>
  <h1>指示プロンプト</h1>
  <p class="topbtns"><button id="add">＋ プロンプトを追加</button> <button id="copyinv">持ち物をコピー</button></p>

  <div id="list"></div>
  <p id="msg" class="note"></p>

  <script src="../assets/config.js?v=202611110238"></script>
  <script src="../assets/app.js?v=202611110238"></script>
  <script>
    const $ = s => document.querySelector(s);
    let prompts = [];
    let items = [];   // 持ち物（{持ち物} の差し込み用）
    const TOKEN_INV = '{持ち物}';
    const fill = body => String(body || '').split(TOKEN_INV).join(ND.inventoryText(items));

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        await Promise.all([
          ND.listFast('prompts', d => { prompts = d; render(); }),
          ND.listFast(null, d => { items = d; })
        ]);
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      $('#list').innerHTML = prompts.length
        ? prompts.map(p => `
            <div class="prompt" data-id="${ND.esc(p.id)}">
              <button type="button" class="ttl" data-act="toggle"><span>${ND.esc(p.title || '（無題）')}</span></button>
              <div class="body">
                <pre>${ND.esc(p.body).split(ND.esc(TOKEN_INV)).join('<mark class="inv">持ち物</mark>')}</pre>
                <div class="actions">
                  <button data-act="copy">全文コピー</button>
                  <button data-act="edit">編集</button>
                  <button data-act="delete">削除</button>
                </div>
              </div>
            </div>`).join('')
        : '<p class="empty">まだありません。</p>';
    }

    // 全文コピー・全文表示・編集・削除
    $('#list').addEventListener('click', async e => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const card = b.closest('.prompt');
      const p = prompts.find(x => x.id === card.dataset.id);
      if (!p) return;

      if (b.dataset.act === 'toggle') {
        card.classList.toggle('open');
        return;
      }
      if (b.dataset.act === 'copy') {
        await ND.copyText(fill(p.body));
        b.textContent = 'コピーしました';
        setTimeout(() => { b.textContent = '全文コピー'; }, 1500);
        return;
      }
      if (b.dataset.act === 'edit') {
        return openForm(p);
      }
      if (b.dataset.act === 'delete') {
        if (!confirm(`「${p.title || '（無題）'}」を削除しますか？`)) return;
        prompts = prompts.filter(x => x !== p);
        render();
        ND.later(() => ND.send('deletePrompt', { id: p.id }), reload);
      }
    });

    // 追加・編集フォーム（タイトルと本文）
    function openForm(p) {
      document.querySelector('#pr-dlg')?.remove();
      const dlg = document.createElement('dialog');
      dlg.id = 'pr-dlg';
      dlg.innerHTML = `
        <form id="pr-form">
          <div class="form-head" tabindex="-1" autofocus><h3>${p ? '編集' : '追加'}</h3></div>
          <div class="form-body">
            <label>タイトル<input name="title" required value="${ND.esc(p?.title || '')}"></label>
            <label class="grow">プロンプト本文<textarea name="body" required>${ND.esc(p?.body || '')}</textarea></label>
            <p class="insert"><button type="button" id="pr-inv">＋ 持ち物を差し込む</button></p>
          </div>
          <div class="form-foot"><button type="button" id="pr-cancel">キャンセル</button><button type="submit">保存</button></div>
        </form>`;
      document.body.appendChild(dlg);
      dlg.querySelector('#pr-cancel').onclick = () => dlg.close();
      // カーソルの位置に {持ち物} を入れる（コピーするとき今の持ち物一覧に置き換わる）
      dlg.querySelector('#pr-inv').onclick = () => {
        const ta = dlg.querySelector('textarea[name=body]');
        const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
        ta.value = ta.value.slice(0, a) + TOKEN_INV + ta.value.slice(b);
        ta.focus();
        ta.setSelectionRange(a + TOKEN_INV.length, a + TOKEN_INV.length);
      };
      dlg.querySelector('#pr-form').onsubmit = async e => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        const fields = { title: f.title.trim(), body: f.body.trim() };
        if (p) {
          Object.assign(p, fields);
          ND.later(() => ND.send('updatePrompt', { id: p.id, ...fields }), reload);
        } else {
          prompts.push({ id: 'tmp' + Date.now(), ...fields });
          ND.later(() => ND.send('addPrompt', fields), reload);
        }
        dlg.close();
        render();
      };
      // iPhone のキーボードが出ても、見えている範囲にぴったり収める
      const vv = window.visualViewport;
      const fit = () => {
        if (!vv) return;
        dlg.style.height = vv.height + 'px';
        dlg.style.top = vv.offsetTop + 'px';
      };
      if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
      dlg.addEventListener('close', () => {
        if (vv) { vv.removeEventListener('resize', fit); vv.removeEventListener('scroll', fit); }
        dlg.remove();
      });
      dlg.showModal();
      fit();
    }

    $('#add').onclick = () => openForm(null);
    $('#copyinv').onclick = async e => {
      const b = e.currentTarget;
      await ND.copyText(ND.inventoryText(items));
      b.textContent = 'コピーしました';
      setTimeout(() => { b.textContent = '持ち物をコピー'; }, 1500);
    };

    reload();
  </script>
</body>
</html>
