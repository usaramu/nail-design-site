<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>うさつめ</title>
  <link rel="stylesheet" href="assets/style.css?v=202611101958">
</head>
<body>
  <h1>うさつめ</h1>
  <ul class="menu">
    <li>
      <a href="designs/index.html">
        <span class="title">デザイン一覧</span>
        <span>制作ガイド・必要な持ち物・足りないものを確認</span>
      </a>
    </li>
    <li>
      <a href="tools/index.html">
        <span class="title">持ち物リスト</span>
        <span>ジェル・ツール・パーツの所持状況（カテゴリ別・残り少なめ）</span>
      </a>
    </li>
    <li>
      <a href="tools/shopping.html">
        <span class="title">購入リスト</span>
        <span>チェックを付けると持ち物リストに移動します</span>
      </a>
    </li>
    <li>
      <a href="prompts/index.html">
        <span class="title">指示プロンプト</span>
        <span>AIに考えさせるときの指示文を保存・全文コピー</span>
      </a>
    </li>
  </ul>

  <div id="lowbox" class="lowbox" hidden>
    <h2>残り少なめ（補充が必要）</h2>
    <ul id="lowlist"></ul>
    <p style="margin:10px 0 0"><a href="tools/shopping.html">購入リストで補充する</a></p>
  </div>

  <script src="assets/config.js?v=202611101958"></script>
  <script src="assets/app.js?v=202611101958"></script>
  <script>
    (async () => {
      if (!ND.configured()) return;
      try {
        await ND.listFast(null, items => {
          const low = items.filter(i => i.status === '持ち物' && i.low);
          document.querySelector('#lowlist').innerHTML = low
            .map(i => `<li>${ND.esc(i.name)}${i.color ? '（' + ND.esc(i.color) + '）' : ''}</li>`).join('');
          document.querySelector('#lowbox').hidden = !low.length;
        });
      } catch (e) { /* 読み込めなくてもトップは表示する */ }
    })();
  </script>
</body>
</html>
