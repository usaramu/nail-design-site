<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネイルデザイン保存</title>
  <style>
    body { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: #faf6f1; color: #3a2a2a; margin: 0; padding: 24px 16px; }
    h1 { color: #7a1f2b; font-size: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; border: 1px solid #e8d9d2; border-radius: 10px; margin-bottom: 12px; }
    li a { display: block; padding: 16px; color: #7a1f2b; text-decoration: none; font-weight: bold; }
    li span { display: block; font-weight: normal; font-size: .85rem; color: #7a6a6a; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>ネイルデザイン一覧</h1>
  <ul>
    <li>
      <a href="designs/harvard-law-chic/index.html">
        Harvard Law Chic（SET02）
        <span>右手・左手の制作ガイドと新規購入品リスト</span>
      </a>
    </li>
    <li>
      <a href="tools/index.html">
        持ち物リスト
        <span>ジェル・ツール・パーツの所持状況（カテゴリ別・残り少なめ表示）</span>
      </a>
    </li>
    <li>
      <a href="tools/shopping.html">
        購入リスト
        <span>チェックを付けると持ち物リストに移動します</span>
      </a>
    </li>
    <li>
      <a href="tools/designs.html">
        デザイン別の持ち物
        <span>デザインごとに、足りないもの・残り少なめを確認</span>
      </a>
    </li>
  </ul>

  <div id="lowbox" hidden style="background:#fff;border:1px solid #e8d9d2;border-radius:10px;padding:16px;margin-top:24px">
    <h2 style="font-size:1rem;color:#7a1f2b;margin:0 0 8px">残り少なめ（補充が必要）</h2>
    <ul id="lowlist" style="padding-left:18px;margin:0;font-size:.9rem;line-height:1.8"></ul>
    <p style="margin:8px 0 0"><a href="tools/shopping.html">購入リストで補充する →</a></p>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (async () => {
      if (!ND.configured()) return;
      try {
        const items = await ND.list();
        const low = items.filter(i => i.status === '持ち物' && i.low);
        if (!low.length) return;
        document.querySelector('#lowlist').innerHTML = low
          .map(i => `<li>${ND.esc(i.name)}${i.color ? '（' + ND.esc(i.color) + '）' : ''}</li>`).join('');
        document.querySelector('#lowbox').hidden = false;
      } catch (e) { /* 読み込めなくてもトップは表示する */ }
    })();
  </script>
</body>
</html>
