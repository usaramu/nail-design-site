<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購入リスト</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611102037">
</head>
<body>
  <p><a href="../index.html">← 一覧へ戻る</a> ／ <a href="index.html">持ち物リストへ</a> ／ <a href="../designs/index.html">デザイン一覧</a></p>
  <h1>購入リスト</h1>
  <p><button id="add">＋ 購入リストに追加</button></p>

  <div id="low"></div>
  <div id="list"></div>
  <p id="msg" class="note"></p>

  <script src="../assets/config.js?v=202611102037"></script>
  <script src="../assets/app.js?v=202611102037"></script>
  <script>
    const $ = s => document.querySelector(s);
    let items = [];

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        await ND.listFast(null, d => { items = d; render(); });
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      // 上部: 持ち物のうち「少なめ」になっているもの（補充候補）
      const low = items.filter(i => i.status === '持ち物' && i.low);
      $('#low').innerHTML = low.length
        ? `<h2>残り少なめ（補充が必要）</h2>` + low.map(i => `
            <div class="row lowrow">
              <span>
                <strong>${ND.esc(i.name)}</strong>
                <small>${ND.esc([i.color, i.size, i.shop, i.sku ? '商品番号 ' + i.sku : ''].filter(Boolean).join(' ／ '))}</small>
              </span>
              <button data-restock="${ND.esc(i.id)}">購入リストに入れる</button>
            </div>`).join('')
        : '';

      // 本体: 購入リスト（少なめのものを各カテゴリの先頭に）
      const rest = items.filter(i => i.status === '購入リスト');
      $('#list').innerHTML = ND.categories.map(cat => {
        const rows = rest.filter(i => i.category === cat).sort((a, b) => Number(b.low) - Number(a.low));
        if (!rows.length) return '';
        return `<h2>${ND.esc(cat)}</h2>` + rows.map(i => `
          <div class="row">
            <input type="checkbox" data-check="${ND.esc(i.id)}" title="持ち物に移動">
            <span>
              <strong>${ND.esc(i.name)}</strong>${i.low ? ' <span class="badge-inline">少なめ</span>' : ''}
              <small>${ND.esc([i.color, i.size, i.shop, i.sku ? '商品番号 ' + i.sku : '', i.note].filter(Boolean).join(' ／ '))}</small>
            </span>
            <button data-edit="${ND.esc(i.id)}">編集</button>
          </div>`).join('');
      }).join('') || '<p class="done">まだありません。</p>';
    }

    // 購入リストに戻す（補充候補 → 購入リスト）
    $('#low').addEventListener('click', async e => {
      const b = e.target.closest('button[data-restock]');
      if (!b) return;
      const item = items.find(i => i.id === b.dataset.restock);
      if (!item) return;
      item.status = '購入リスト';
      render();
      ND.later(() => ND.send('setStatus', { id: item.id, status: '購入リスト' }), reload);
    });

    // チェック → 持ち物へ移動（少なめの印は外す）
    $('#list').addEventListener('change', async e => {
      if (!e.target.matches('input[type=checkbox]')) return;
      const id = e.target.dataset.check;
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.status = '持ち物';
      item.low = false;
      render();
      ND.later(async () => {
        await ND.send('setStatus', { id, status: '持ち物' });
        await ND.send('setLow', { id, low: false });
      }, reload);
    });

    $('#list').addEventListener('click', e => {
      const b = e.target.closest('button[data-edit]');
      if (!b) return;
      const item = items.find(i => i.id === b.dataset.edit);
      ND.openEditor(item, f => {
        Object.assign(item, f);
        render();
        ND.later(() => ND.send('update', { id: item.id, fields: f }), reload);
      }, { onDelete: () => { ND.removeItem(item, reload); render(); } });
    });

    $('#add').onclick = () => ND.openEditor(null, f => {
      const item = { ...f, status: '購入リスト', low: false };
      items.push({ ...item, id: 'tmp' + Date.now() });
      render();
      ND.later(() => ND.send('add', { item }), reload);
    });

    reload();
  </script>
</body>
</html>
