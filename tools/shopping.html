<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購入リスト</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <p><a href="../index.html">← 一覧へ戻る</a> ／ <a href="index.html">持ち物リストへ</a></p>
  <h1>購入リスト</h1>
  <p class="note">チェックを付けると持ち物リストに移動します。どの端末からも同じ内容が見られます。</p>
  <p><button id="add">＋ 購入リストに追加</button></p>
  <div id="list"></div>
  <p id="msg" class="note"></p>

  <script src="../assets/config.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    let items = [];

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません（assets/config.js にURLと合言葉を入れてください）。';
        return;
      }
      try {
        items = await ND.list();
        render();
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      const rest = items.filter(i => i.status === '購入リスト');
      $('#list').innerHTML = ND.categories.map(cat => {
        const rows = rest.filter(i => i.category === cat);
        if (!rows.length) return '';
        return `<h2>${ND.esc(cat)}</h2>` + rows.map(i => `
          <div class="row">
            <input type="checkbox" data-check="${ND.esc(i.id)}" title="持ち物に移動">
            <span>
              <strong>${ND.esc(i.name)}</strong>
              <small>${ND.esc([i.color, i.size, i.shop, i.note].filter(Boolean).join(' ／ '))}</small>
            </span>
            <button data-edit="${ND.esc(i.id)}">編集</button>
          </div>`).join('');
      }).join('') || '<p class="done">購入リストは空です。</p>';
    }

    $('#list').addEventListener('change', async e => {
      if (!e.target.matches('input[type=checkbox]')) return;
      e.target.disabled = true;
      try {
        await ND.send('setStatus', { id: e.target.dataset.check, status: '持ち物' });
        await reload();
      } catch (err) {
        alert('移動できませんでした: ' + err.message);
        e.target.disabled = false;
      }
    });

    $('#list').addEventListener('click', e => {
      const b = e.target.closest('button[data-edit]');
      if (!b) return;
      const item = items.find(i => i.id === b.dataset.edit);
      ND.openEditor(item, async f => {
        await ND.send('update', { id: item.id, fields: f });
        await reload();
      });
    });

    $('#add').onclick = () => ND.openEditor(null, async f => {
      await ND.send('add', { item: { ...f, status: '購入リスト', low: false } });
      await reload();
    });

    reload();
  </script>
</body>
</html>
