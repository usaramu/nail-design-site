<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持ち物リスト</title>
  <link rel="stylesheet" href="../assets/style.css?v=202611101742">
  <style>
    /* スマホで横に2つ並ぶ小さめのカード */
    #list .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
    #list .card { text-align: center; padding-top: 14px; }

    /* ジェル・パーツ：丸い写真が主役。写真がないときは点線の丸 */
    .circle {
      width: 92px; height: 92px; aspect-ratio: 1 / 1;
      border-radius: 50%; display: block; margin: 6px auto 14px;
    }
    #list .card img.circle {
      width: 92px; height: 92px; aspect-ratio: 1 / 1; border-radius: 50%;
      margin: 6px auto 14px; object-fit: cover; border: 1px solid var(--line);
      outline: 1px solid var(--gold); outline-offset: 3px; cursor: zoom-in;
    }
    button.circle {
      padding: 0; border: 1px dashed var(--gold); background: var(--surface);
      color: var(--muted); font-size: .72rem;
    }
    button.circle:hover { background: var(--surface); color: var(--bordeaux); }

    #list .card > img.zoom:not(.circle) { margin-bottom: 10px; }
    #list .card h3 {
      font-family: var(--sans); font-weight: 400; font-size: .84rem;
      letter-spacing: 0; line-height: 1.6; margin: 0 0 4px; color: var(--ink);
    }
    #list .card .badge-inline { margin-left: 4px; font-size: .66rem; white-space: nowrap; }
    #list .meta { font-size: .72rem; line-height: 1.7; }
    #list .actions { justify-content: center; gap: 5px; margin-top: 10px; }
    #list .actions button { font-size: .68rem; padding: 3px 7px; }

    /* 検索とタグの絞り込み */
    .finder { margin: 14px 0 6px; }
    .finder input[type=search] {
      width: 100%; padding: 9px 12px; font: inherit; font-size: .9rem; color: var(--ink);
      border: 1px solid var(--line); border-radius: 2px; background: var(--surface);
    }
    .finder input[type=search]:focus { outline: none; border-color: var(--gold); }
    .tagfilter { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tagfilter button, .tagfilter .sep {
      font-size: .72rem; padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--ink); background: var(--surface);
    }
    .tagfilter button:hover { background: var(--surface); color: var(--bordeaux); }
    .tagfilter button.on { background: var(--bordeaux); border-color: var(--bordeaux); color: #fff; }
    .tagfilter .sep { border: 0; background: transparent; color: var(--muted); padding: 2px 2px 2px 6px; }

    /* カテゴリの見出し */
    #list section + section { margin-top: 8px; }
    #list h2.cat { display: flex; align-items: baseline; gap: 8px; }
    #list h2.cat small { font-family: var(--sans); font-weight: 300; font-size: .78rem; color: var(--muted); }

    /* カードのタグ */
    #list .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 6px 0 2px; }
    #list .tags span { font-size: .64rem; line-height: 1.5; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
    #list .tags span.c { border-color: var(--gold); color: var(--ink); }
  </style>
</head>
<body>
  <p><a href="../index.html">← 一覧へ戻る</a> ／ <a href="shopping.html">購入リストへ</a> ／ <a href="../designs/index.html">デザイン一覧</a></p>
  <h1>持ち物リスト</h1>

  <div class="tabs" id="tabs"></div>
  <div class="finder">
    <input id="q" type="search" placeholder="名前・色番号・商品番号で検索" autocomplete="off">
    <div class="tagfilter" id="tagfilter"></div>
  </div>
  <p><button id="add">＋ 持ち物を追加</button></p>
  <div id="list"></div>
  <p id="msg" class="note"></p>

  <script src="../assets/config.js?v=202611101742"></script>
  <script src="../assets/app.js?v=202611101742"></script>
  <script>
    const $ = s => document.querySelector(s);
    let items = [];
    let filter = 'all';
    let query = '';
    const picked = new Set(); // 絞り込み中のタグ
    const tagsOfItem = i => [...ND.tagsOf(i.colortag), ...ND.tagsOf(i.texture)];

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        items = await ND.list();
        render();
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      const mine = items.filter(i => i.status === '持ち物');
      const tabs = [
        ['all', 'すべて', mine.length],
        ['low', '残り少なめ', mine.filter(i => i.low).length],
        ...ND.categories.map(c => [c, c, mine.filter(i => i.category === c).length])
      ];
      $('#tabs').innerHTML = tabs.map(([k, label, n]) =>
        `<button data-k="${ND.esc(k)}" class="${filter === k ? 'on' : ''}">${ND.esc(label)}（${n}）</button>`).join('');

      let view = mine;
      if (filter === 'low') view = mine.filter(i => i.low);
      else if (filter !== 'all') view = mine.filter(i => i.category === filter);

      // タグの絞り込み札（今の一覧にあるタグだけ出す）
      const present = new Set(view.flatMap(tagsOfItem));
      const colors = ND.colorTags.filter(t => present.has(t) || picked.has(t));
      const textures = ND.textureTags.filter(t => present.has(t) || picked.has(t));
      const chip = t => `<button type="button" data-tag="${ND.esc(t)}" class="${picked.has(t) ? 'on' : ''}">${ND.esc(t)}</button>`;
      $('#tagfilter').innerHTML =
        (colors.length ? '<span class="sep">色</span>' + colors.map(chip).join('') : '') +
        (textures.length ? '<span class="sep">質感</span>' + textures.map(chip).join('') : '');

      // 検索とタグで絞る
      const q = query.trim().toLowerCase();
      if (q) view = view.filter(i => [i.name, i.color, i.sku, i.shop, i.note, i.category, i.colortag, i.texture]
        .some(v => String(v ?? '').toLowerCase().includes(q)));
      if (picked.size) view = view.filter(i => { const t = tagsOfItem(i); return [...picked].every(p => t.includes(p)); });

      // カテゴリごとに見出しで区切る
      const cats = ND.categories.filter(c => filter === 'all' || filter === 'low' || filter === c);
      const html = cats.map(c => {
        const list = view.filter(i => i.category === c);
        if (!list.length) return '';
        return `<section><h2 class="cat">${ND.esc(c)}<small>${list.length}</small></h2><div class="grid">${list.map(card).join('')}</div></section>`;
      }).join('');
      $('#list').innerHTML = html || '<p class="empty">見つかりません。</p>';
    }

    const photoSrc = p => /^(https?:|data:)/.test(p) ? p : '../' + p;

    function card(i) {
      const id = ND.esc(i.id);
      const name = ND.esc(i.name);
      const round = i.category === 'ジェル' || i.category === 'パーツ';
      let head;
      if (round) {
        // 写真があれば丸い写真、なければ押して写真を入れる点線の丸
        head = (i.photo
          ? `<img class="circle zoom" src="${ND.esc(photoSrc(i.photo))}" alt="${name}" title="タップで拡大">`
          : `<button type="button" class="circle" data-act="pick" data-id="${id}">写真</button>`)
          + `<input type="file" accept="image/*" data-id="${id}" hidden>`;
      } else {
        head = i.photo ? `<img src="${ND.esc(photoSrc(i.photo))}" alt="${name}" loading="lazy" class="zoom" title="タップで拡大">` : '';
      }
      return `
        <div class="card">
          ${head}
          <h3>${name}${i.low ? '<span class="badge-inline">少なめ</span>' : ''}</h3>
          ${tagsOfItem(i).length ? `<div class="tags">${ND.tagsOf(i.colortag).map(t => `<span class="c">${ND.esc(t)}</span>`).join('')}${ND.tagsOf(i.texture).map(t => `<span>${ND.esc(t)}</span>`).join('')}</div>` : ''}
          <div class="meta">${[i.color, i.size, i.shop, i.sku ? '商品番号 ' + i.sku : ''].filter(Boolean).map(ND.esc).join('<br>')}</div>
          <div class="actions">
            <button data-act="low" data-id="${id}">${i.low ? '少なめ解除' : '少なめ'}</button>
            ${round && i.photo ? `<button data-act="pick" data-id="${id}">写真</button>` : ''}
            <button data-act="edit" data-id="${id}">編集</button>
            <button data-act="back" data-id="${id}">購入リストへ</button>
          </div>
        </div>`;
    }

    $('#q').addEventListener('input', e => { query = e.target.value; render(); });
    $('#tagfilter').addEventListener('click', e => {
      const t = e.target.closest('button[data-tag]')?.dataset.tag;
      if (!t) return;
      picked.has(t) ? picked.delete(t) : picked.add(t);
      render();
    });

    $('#tabs').addEventListener('click', e => {
      const k = e.target.closest('button')?.dataset.k;
      if (k) { filter = k; render(); }
    });

    $('#list').addEventListener('click', async e => {
      if (e.target.matches('img.zoom')) return ND.lightbox(e.target.src, e.target.alt);
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      if (b.dataset.act === 'pick') {
        b.closest('.card').querySelector('input[type=file]').click();
        return;
      }
      const item = items.find(i => i.id === b.dataset.id);
      try {
        if (b.dataset.act === 'edit') {
          ND.openEditor(item, async f => {
            await ND.send('update', { id: item.id, fields: f });
            await reload();
          });
          return;
        }
        if (b.dataset.act === 'low') await ND.send('setLow', { id: item.id, low: !item.low });
        if (b.dataset.act === 'back') await ND.send('setStatus', { id: item.id, status: '購入リスト' });
        await reload();
      } catch (err) {
        alert('更新できませんでした: ' + err.message);
      }
    });

    // 写真を選んだら、小さくしてその持ち物に保存する
    $('#list').addEventListener('change', async e => {
      const input = e.target;
      if (input.type !== 'file') return;
      const file = input.files[0];
      if (!file) return;
      const item = items.find(i => i.id === input.dataset.id);
      $('#msg').textContent = '写真を保存しています…';
      try {
        const url = await ND.photoDataUrl(file);
        await ND.send('update', { id: item.id, fields: { photo: url } });
        $('#msg').textContent = '写真を保存しました。';
        await reload();
      } catch (err) {
        $('#msg').textContent = '';
        alert('保存できませんでした: ' + err.message);
      }
      input.value = '';
    });

    $('#add').onclick = () => ND.openEditor(null, async f => {
      await ND.send('add', { item: { ...f, status: '持ち物', low: false } });
      await reload();
    });

    reload();
  </script>
</body>
</html>
