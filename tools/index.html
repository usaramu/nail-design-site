<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持ち物リスト</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    /* ジェルの色見本（名前の右横の丸） */
    .swatchrow { display: flex; align-items: center; gap: 14px; }
    .swatchrow h3 { flex: 1; margin: 0; }
    .swatch {
      width: 56px; height: 56px; flex-shrink: 0;
      border-radius: 50%; padding: 0; overflow: hidden;
      border: 1px dashed var(--gold); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
    }
    .swatch:hover { background: var(--surface); color: var(--bordeaux); }
    .swatch img { width: 100%; height: 100%; object-fit: cover; border: 0; border-radius: 0; margin: 0; cursor: zoom-in; }
    .swatch span { font-size: .72rem; }
    .swatch-solid { border: 1px solid var(--line); }
  </style>
</head>
<body>
  <p><a href="../index.html">← 一覧へ戻る</a> ／ <a href="shopping.html">購入リストへ</a> ／ <a href="../designs/index.html">デザイン一覧</a></p>
  <h1>持ち物リスト</h1>

  <div class="tabs" id="tabs"></div>
  <p><button id="add">＋ 持ち物を追加</button></p>
  <div class="grid" id="list"></div>
  <p id="msg" class="note"></p>

  <script src="../assets/config.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    const $ = s => document.querySelector(s);
    let items = [];
    let filter = 'all';

    async function reload() {
      if (!ND.configured()) {
        $('#msg').textContent = 'まだ設定されていません。';
        return;
      }
      try {
        items = await ND.list();
        render();
      } catch (e) {
        $('#msg').textContent = '読み込みに失敗しました: ' + e.message;
      }
    }

    function render() {
      const mine = items.filter(i => i.status === '持ち物');
      const tabs = [
        ['all', 'すべて', mine.length],
        ['low', '残り少なめ', mine.filter(i => i.low).length],
        ...ND.categories.map(c => [c, c, mine.filter(i => i.category === c).length])
      ];
      $('#tabs').innerHTML = tabs.map(([k, label, n]) =>
        `<button data-k="${ND.esc(k)}" class="${filter === k ? 'on' : ''}">${ND.esc(label)}（${n}）</button>`).join('');

      let view = mine;
      if (filter === 'low') view = mine.filter(i => i.low);
      else if (filter !== 'all') view = mine.filter(i => i.category === filter);

      $('#list').innerHTML = view.length
        ? view.map(card).join('')
        : '<p class="empty">まだありません。</p>';
    }

    const photoSrc = p => /^(https?:|data:)/.test(p) ? p : '../' + p;

    function card(i) {
      const id = ND.esc(i.id);
      const name = ND.esc(i.name);
      const isGel = i.category === 'ジェル' || i.category === 'パーツ';
      const label = i.category === 'ジェル' ? '色見本' : '写真';
      const head = isGel
        ? `<div class="swatchrow">
             <h3>${name}</h3>
             ${i.photo
               ? `<img class="swatch zoom swatch-solid" src="${ND.esc(photoSrc(i.photo))}" alt="${name}" title="タップで拡大" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0">`
               : `<button type="button" class="swatch" data-act="pick" data-id="${id}" title="写真を入れる"><span>写真</span></button>`}
           </div>
           <input type="file" accept="image/*" data-id="${id}" hidden>`
        : `${i.photo ? `<img src="${ND.esc(photoSrc(i.photo))}" alt="${name}" loading="lazy" class="zoom" title="タップで拡大">` : ''}
           <h3>${name}</h3>`;
      return `
        <div class="card">
          ${i.low ? '<span class="badge">少なめ</span>' : ''}
          ${head}
          <div class="meta">${[i.category, i.color, i.size, i.shop, i.note].filter(Boolean).map(ND.esc).join('<br>')}</div>
          <div class="actions">
            <button data-act="low" data-id="${id}">${i.low ? '少なめを解除' : '少なめにする'}</button>
            ${isGel ? `<button data-act="pick" data-id="${id}">${label}の写真を${i.photo ? '変える' : '入れる'}</button>` : ''}
            <button data-act="edit" data-id="${id}">編集</button>
            <button data-act="back" data-id="${id}">購入リストに戻す</button>
          </div>
        </div>`;
    }

    $('#tabs').addEventListener('click', e => {
      const k = e.target.closest('button')?.dataset.k;
      if (k) { filter = k; render(); }
    });

    $('#list').addEventListener('click', async e => {
      if (e.target.matches('img.zoom')) return ND.lightbox(e.target.src, e.target.alt);
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      if (b.dataset.act === 'pick') {
        b.closest('.card').querySelector('input[type=file]').click();
        return;
      }
      const item = items.find(i => i.id === b.dataset.id);
      try {
        if (b.dataset.act === 'edit') {
          ND.openEditor(item, async f => {
            await ND.send('update', { id: item.id, fields: f });
            await reload();
          });
          return;
        }
        if (b.dataset.act === 'low') await ND.send('setLow', { id: item.id, low: !item.low });
        if (b.dataset.act === 'back') await ND.send('setStatus', { id: item.id, status: '購入リスト' });
        await reload();
      } catch (err) {
        alert('更新できませんでした: ' + err.message);
      }
    });

    // 色見本の写真を選んだら、軽くしてドライブに保存し、そのジェルに登録する
    $('#list').addEventListener('change', async e => {
      const input = e.target;
      if (input.type !== 'file') return;
      const file = input.files[0];
      if (!file) return;
      const item = items.find(i => i.id === input.dataset.id);
      $('#msg').textContent = '写真を保存しています…';
      try {
        const url = await ND.photoDataUrl(file);
        await ND.send('update', { id: item.id, fields: { photo: url } });
        $('#msg').textContent = '写真を保存しました。';
        await reload();
      } catch (err) {
        $('#msg').textContent = '';
        alert('保存できませんでした: ' + err.message);
      }
      input.value = '';
    });

    $('#add').onclick = () => ND.openEditor(null, async f => {
      await ND.send('add', { item: { ...f, status: '持ち物', low: false } });
      await reload();
    });

    reload();
  </script>
</body>
</html>
